[CONFIGURACOES]
# Opções de navegador: firefox, chrome, edge ou auto (detecta automaticamente do Windows)
navegador = firefox

# Intervalo em segundos entre envios (para proteção da sua conta contra bloqueio)
delay_minimo = 8
delay_maximo = 15

# Imagem padrão para enviar a todos como 2ª mensagem
# Se deixado em branco, o bot usará automaticamente qualquer foto que estiver na pasta 'imagens'
imagem_padrao = exemplo.jpeg
